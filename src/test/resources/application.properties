# Config for the @QuarkusTest classes only; the unit tests mock ConfigurationLoader.configProvider.
# RefusingLogboekDriver accepts the connection and the schema and refuses every insert, so
# under simple + fail-closed every logregel write fails. Username, password and table are
# required by the config validation and ignored by the driver.
logboekdataverwerking.enabled=true
logboekdataverwerking.service-name=logboekdataverwerking-wrapper-test
logboekdataverwerking.dbms=postgresql
logboekdataverwerking.postgresql.url=jdbc:logboek-weigert://logboek
logboekdataverwerking.postgresql.username=logboek
logboekdataverwerking.postgresql.password=logboek
logboekdataverwerking.postgresql.table=logging
logboekdataverwerking.span-processor=simple
logboekdataverwerking.write-failure-policy=fail-closed

quarkus.http.test-port=0
